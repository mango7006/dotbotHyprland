monitor = eDP-1, 1920x1080@60, 0x0, 1
# Change this according to your needs, I need screen mirrors for presentations
monitor = , preferred, auto, 1, mirror, eDP-1

# Set programs that you use
$terminal = kitty
$menu = wofi --show drun --allow-images --term=kitty
$browser = firefox
$wallpaper = ~/.config/hypr/wallpapers/tTIlCNT.png

exec-once = swww-daemon
exec-once = swww img $wallpaper --transition-type none
exec-once = waybar
exec-once = swaync
exec-once = clipse -listen
exec-once = hypridle
exec-once = syshud -p top

exec-once = kitty --class terminalfloatsmall -e ~/.config/scripts/wireguard-master.sh toggle
exec-once = rm /home/mango/ly-session.log

exec-once = hyprctl setcursor Bibata-Modern-Classic 20
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Classic

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = TERM,$terminal

general {
  gaps_in = 12
  gaps_out = 12
  border_size = 4
  col.active_border = rgb(d65d0e)
  col.inactive_border = rgb(3c3836)
  layout = dwindle
  allow_tearing = false
}

decoration {
  active_opacity = 1
  inactive_opacity = 1
  rounding = 0
  blur {
    enabled = true
    size = 6
    passes = 3
    contrast = 2.0
    vibrancy_darkness = 1.0
    brightness = 1.3
    vibrancy = 1
  }
  shadow {
    enabled = no
  }
}

ecosystem {
  no_update_news = true
}

animations {
  enabled = yes

  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1

  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear
  animation = workspaces, 1, 1.94, almostLinear, fade
  animation = workspacesIn, 1, 1.21, almostLinear, fade
  animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ignore maximize requests from apps
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# I don't remember what does does but it seems important
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]TSInstall hyprlang

# Disable screensharing of passwords
windowrulev2 = noscreenshare, class:Bitwarden

# Blur rules
layerrule = blur,waybar
layerrule = blur,wofi

# fullscreen rule
windowrulev2 = fullscreen, class:com.moonlight_stream.Moonlight

# Force these apps to float
windowrulev2 = float, class:terminalfloat
windowrulev2 = size 1000 600, class:terminalfloat
windowrulev2 = move 460 240, class:terminalfloat

windowrulev2 = float, class:terminalfloatsmall
windowrulev2 = size 400 100, class:terminalfloatsmall
windowrulev2 = move 760 340, class:terminalfloatsmall

windowrulev2 = float, class:waypaper
windowrulev2 = size 800 600, class:waypaper
windowrulev2 = move 560 240, class:waypaper

windowrulev2 = float, class:org.pulseaudio.pavucontrol
windowrulev2 = size 1000 600, class:org.pulseaudio.pavucontrol
windowrulev2 = move 460 240, class:org.pulseaudio.pavucontrol

windowrulev2 = float, class:nm-connection-editor
windowrulev2 = size 1000 600, class:nm-connection-editor
windowrulev2 = move 460 240, class:nm-connection-editor

windowrulev2 = float, class:blueberry.py
windowrulev2 = size 1000 600, class:blueberry.py
windowrulev2 = move 460 240, class:blueberry.py

dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  force_default_wallpaper = 0
  vfr = true
  enable_swallow = true
  swallow_regex = ^($terminal)$
  disable_hyprland_logo = true
  font_family = Mononoki Nerd Font
  splash_font_family = Mononoki Nerd Font
}

input {
  kb_layout = us,us
  kb_variant = ,intl
  follow_mouse = 1
  numlock_by_default = true
  sensitivity = 0

  touchpad {
    natural_scroll = false
    tap-to-click = false
    disable_while_typing = false # disable_while_typing sucks ass
  }
}

bind = SUPER, Q, exec, $terminal
bind = SUPER, C, killactive,
# bind = SUPER, M, exit, # Do not use this, will kill all applications
bind = SUPER, V, togglefloating,
bind = SUPER SHIFT, F, fullscreen
bind = SUPER, A, exec, $menu
bind = SUPER, F, exec, $browser 
bind = SUPER, P, exec, $browser --private-window
bind = SUPER, L, exec, hyprlock

# The actions menu, a list of the most used scripts/actions on my system
bind = SUPER, X, exec, ~/.config/scripts/shutdown-menu.sh
bind = SUPER, S, exec, ~/.config/scripts/actions-menu.sh

bind = SUPER, H, exec, swaync-client -t -sw
bind = SUPER, J, exec, swaync-client -C
bind = SUPER SHIFT, A, exec, $terminal --class terminalfloat -e clipse

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Screenshot selected area
bindlr = , print, exec, hyprshot -m region -o ~/Screenshots

# Resize windows with CRTL + arrow keys
bindel = CTRL, right, resizeactive, 20 0
bindel = CTRL, left, resizeactive, -20 0
bindel = CTRL, up, resizeactive, 0 -20
bindel = CTRL, down, resizeactive, 0 20

# Move windows with SHIFT + arrow keys
bind = SHIFT, left, movewindow, l
bind = SHIFT, right, movewindow, r
bind = SHIFT, up, movewindow, u
bind = SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-4] (limit otherwise I get distracted)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-4] (limit otherwise I get distracted)
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.3
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Laptop multimedia keys for LCD brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%- --min-value=1

# Lock lid switch - Optional, laptop only
bindl=,switch:off:Lid Switch, exec, hyprlock --immediate
bindl=,switch:on:Lid Switch, exec, hyprlock --immediate

# Multimedia keys for playback control - Requires playerctl and buttons, I don't have buttons :(
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause, exec, playerctl play-pause
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous
bindl = SUPER, O, exec, playerctl next
bindl = SUPER, I, exec, playerctl play-pause
bindl = SUPER, U, exec, playerctl previous

## Packages directly used in this config:
# hyprland (of course)
# playerctl (playerctl media manager)
# hyprlock (hyprland lockscreen)
# brightnessctl (laptop brightness changer)
# wireplumber (wpctl audio manager)
# hyprshot (hyprland screenshot util)
# wofi
# waybar
# firefox
# kitty
# clipse (AUR)
# swaync (notification center client)
# ttf-mononoki-nerd (Nerd font for Hyprland)
# moonlight (desktop streaming service (just a windowrule, not a required thing) )
# waypaper (GUI walpaper util (just a windowrule, not a required thing) )
# blueberry (GUI bluetooth manager (just a windowrule, not a required thing) )
# pavucontrol (GUI volume manager (just a windowrule, not a required thing) )
# nm-connection-editor (GUI network manager (just a windowrule, not a required thing) )
# bitwarden (GUI password manager (just a windowrule, not a required thing) )
# bibata-cursor-theme-bin (AUR cursor theme)
# syshud (AUR OSD thingie)
# hypridle (hyprland idle locker)
# swww (wayland wallpaper util)

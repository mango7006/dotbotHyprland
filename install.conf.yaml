- defaults:
    link:
      relink: true
      force: true
      create: true

- clean: ['~']

- link:
    ~/.config/nvim: config/nvim/
    ~/.config/waypaper: config/waypaper/
    ~/.config/hypr: config/hypr/
    ~/.config/kitty: config/kitty/
    ~/.config/swaync: config/swaync/
    ~/.config/waybar: config/waybar/
    ~/.config/wofi: config/wofi/
    ~/.config/gtk-3.0: config/gtk-3.0/
    ~/.config/gtk-4.0: config/gtk-4.0/
    ~/.config/sys64/hud: config/hud/
    ~/.config/starship.toml: config/starship.toml
    ~/.config/scripts: config/scripts/
    ~/.config/topgrade.toml: config/topgrade.toml
    ~/.zshrc: home/.zshrc

    ~/.local/share/applications/avahi-discover.desktop: desktop-files/avahi-discover.desktop
    ~/.local/share/applications/bssh.desktop: desktop-files/bssh.desktop
    ~/.local/share/applications/bvnc.desktop: desktop-files/bvnc.desktop
    ~/.local/share/applications/cmake-gui.desktop: desktop-files/cmake-gui.desktop
    ~/.local/share/applications/electron36.desktop: desktop-files/electron36.desktop
    ~/.local/share/applications/electron37.desktop: desktop-files/electron37.desktop
    ~/.local/share/applications/gammastep.desktop: desktop-files/gammastep.desktop
    ~/.local/share/applications/gammastep-indicator.desktop: desktop-files/gammastep-indicator.desktop
    ~/.local/share/applications/nvim.desktop: desktop-files/nvim.desktop
    ~/.local/share/applications/qv4l2.desktop: desktop-files/qv4l2.desktop
    ~/.local/share/applications/qvidcap.desktop: desktop-files/qvidcap.desktop
    ~/.local/share/applications/vim.desktop: desktop-files/vim.desktop
    ~/.local/share/applications/xgps.desktop: desktop-files/xgps.desktop
    ~/.local/share/applications/xgpsspeed.desktop: desktop-files/xgpsspeed.desktop
    ~/.local/share/applications/yazi.desktop: desktop-files/yazi.desktop
    ~/.local/share/applications/btop.desktop: desktop-files/btop.desktop
    ~/.local/share/applications/wiremix.desktop: desktop-files/wiremix.desktop
    ~/.local/share/applications/impala.desktop: desktop-files/impala.desktop
    ~/.local/share/applications/bluetui.desktop: desktop-files/bluetui.desktop
    ~/.local/share/applications/bluetui.png: desktop-files/bluetui.png
    ~/.local/share/applications/impala.png: desktop-files/impala.png
    ~/.local/share/applications/wiremix.png: desktop-files/wiremix.png

- create:
    - ~/.local/share/applications
    - ~/Screenshots
    - ~/Downloads
    - ~/gits

- shell:
  - [git submodule update --init --recursive, Installing submodules]

